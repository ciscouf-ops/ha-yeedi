name: Release

# Attach yeedi.zip to every published release: HACS installs it (hacs.json
# "zip_release") and shows its download count.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    name: Attach yeedi.zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/yeedi/manifest.json'))['version'])")
          if [ "${TAG#v}" != "$version" ]; then
            echo "::warning::Tag $TAG but manifest.json says $version"
          fi
      - name: Zip the integration
        run: |
          cd custom_components/yeedi
          zip -r "$GITHUB_WORKSPACE/yeedi.zip" . -x "__pycache__/*" "*/__pycache__/*"
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" yeedi.zip --clobber
